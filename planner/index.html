<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="계획표">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>계획표</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--fg:#1d1d1f;--sub:#86868b;--line:#e5e5ea;--acc:#0a84ff;--h:64px}
@media(prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--fg:#f5f5f7;--sub:#98989d;--line:#2c2c2e}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 -apple-system,system-ui,sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
header h1{flex:1;margin:0;font-size:20px;text-align:center}
button{font:inherit;color:var(--acc);background:none;border:0;padding:8px 12px;border-radius:8px;cursor:pointer}
button:active{background:var(--line)}
#grid{position:relative;margin:0 auto;max-width:820px;padding:8px 16px 40px 60px}
.hour{height:var(--h);border-top:1px solid var(--line);position:relative}
.hour span{position:absolute;left:-48px;top:-9px;font-size:12px;color:var(--sub);width:40px;text-align:right}
#blocks{position:absolute;left:60px;right:16px;top:8px}
.blk{position:absolute;left:0;right:0;border-radius:8px;padding:4px 8px;color:#fff;overflow:hidden;font-size:14px;cursor:pointer;border-left:4px solid rgba(0,0,0,.25)}
.blk small{display:block;opacity:.85;font-size:11px}
.blk.done{opacity:.45;text-decoration:line-through}
#now{position:absolute;left:52px;right:16px;height:2px;background:#ff3b30;z-index:2;pointer-events:none}
dialog{border:0;border-radius:16px;padding:20px;background:var(--card);color:var(--fg);width:min(420px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.4)}
label{display:block;font-size:13px;color:var(--sub);margin-top:12px}
input{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
.row{display:flex;gap:8px}.row>*{flex:1}
.colors{display:flex;gap:10px;margin-top:8px}
.colors i{width:32px;height:32px;border-radius:50%;cursor:pointer;border:3px solid transparent}
.colors i.sel{border-color:var(--fg)}
.actions{display:flex;justify-content:space-between;margin-top:18px}
.del{color:#ff3b30}
</style>
</head>
<body>
<header>
  <button id="prev">‹</button>
  <h1 id="title"></h1>
  <button id="today">오늘</button>
  <button id="next">›</button>
  <button id="menu">⋯</button>
</header>
<div id="grid"><div id="blocks"></div></div>

<dialog id="dlg">
  <form method="dialog" id="form">
    <label>제목<input id="f-title" required></label>
    <div class="row">
      <label>시작<input id="f-start" type="time" step="900" required></label>
      <label>종료<input id="f-end" type="time" step="900" required></label>
    </div>
    <div class="colors" id="colors"></div>
    <label><input id="f-done" type="checkbox" style="width:auto"> 완료</label>
    <div class="actions">
      <button type="button" class="del" id="f-del">삭제</button>
      <span><button type="button" id="f-cancel">취소</button><button type="submit"><b>저장</b></button></span>
    </div>
  </form>
</dialog>

<dialog id="mdlg">
  <button id="m-export" style="display:block">데이터 내보내기 (JSON)</button>
  <button id="m-import" style="display:block">데이터 가져오기 (JSON)</button>
  <button id="m-close" style="display:block">닫기</button>
  <input type="file" id="file" accept="application/json" hidden>
</dialog>

<script>
const START = 5, END = 24, H = 64;            // 표시 시간대(05~24시), 시간당 높이(px)
const COLORS = ['#0a84ff','#30b350','#ff9f0a','#ff453a','#bf5af2','#8e8e93'];
const KEY = 'planner-v1';
const $ = id => document.getElementById(id);

let db = {};                                    // { 'YYYY-MM-DD': [{id,title,start,end,color,done}] }
try { db = JSON.parse(localStorage.getItem(KEY)) || {}; } catch {}
const save = () => localStorage.setItem(KEY, JSON.stringify(db));

const fmt = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const toMin = t => +t.slice(0,2)*60 + +t.slice(3);
const toTime = m => `${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
let day = new Date(); day.setHours(0,0,0,0);
let editing = null, color = COLORS[0];

// 시간 눈금
const grid = $('grid');
for (let h = START; h < END; h++) {
  const el = document.createElement('div');
  el.className = 'hour'; el.dataset.h = h;
  el.innerHTML = `<span>${String(h).padStart(2,'0')}:00</span>`;
  grid.insertBefore(el, $('blocks'));
}
$('blocks').style.height = (END-START)*H + 'px';

function render() {
  $('title').textContent = day.toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'short'});
  const box = $('blocks'); box.innerHTML = '';
  for (const b of db[fmt(day)] || []) {
    const top = (toMin(b.start)/60 - START)*H, hgt = Math.max((toMin(b.end)-toMin(b.start))/60*H, 24);
    const el = document.createElement('div');
    el.className = 'blk' + (b.done ? ' done' : '');
    el.style.cssText = `top:${top}px;height:${hgt-2}px;background:${b.color}`;
    el.innerHTML = `${b.title.replace(/</g,'&lt;')}<small>${b.start}–${b.end}</small>`;
    el.onclick = e => { e.stopPropagation(); openEdit(b); };
    box.appendChild(el);
  }
  const old = $('now'); if (old) old.remove();
  const n = new Date();
  if (fmt(n) === fmt(day) && n.getHours() >= START) {
    const l = document.createElement('div'); l.id = 'now';
    l.style.top = 8 + ((n.getHours()*60+n.getMinutes())/60 - START)*H + 'px';
    grid.appendChild(l);
  }
}

// 빈 시간 탭 → 새 블록 (15분 단위 스냅)
grid.addEventListener('click', e => {
  const r = grid.getBoundingClientRect();
  const y = e.clientY - r.top - 8;
  if (y < 0) return;
  const m = Math.min(Math.floor((START*60 + y/H*60)/15)*15, END*60-60);
  openEdit({ title:'', start:toTime(m), end:toTime(m+60), color:COLORS[0], done:false });
});

function openEdit(b) {
  editing = b;
  $('f-title').value = b.title; $('f-start').value = b.start; $('f-end').value = b.end;
  $('f-done').checked = b.done; $('f-del').style.visibility = b.id ? 'visible' : 'hidden';
  color = b.color; drawColors(); $('dlg').showModal();
}
function drawColors() {
  $('colors').innerHTML = '';
  for (const c of COLORS) {
    const i = document.createElement('i'); i.style.background = c;
    if (c === color) i.className = 'sel';
    i.onclick = () => { color = c; drawColors(); };
    $('colors').appendChild(i);
  }
}
$('form').onsubmit = () => {
  if (toMin($('f-end').value) <= toMin($('f-start').value)) { alert('종료 시간이 시작보다 늦어야 해요'); return false; }
  const list = db[fmt(day)] ||= [];
  const data = { title:$('f-title').value.trim(), start:$('f-start').value, end:$('f-end').value, color, done:$('f-done').checked };
  if (editing.id) Object.assign(editing, data); else list.push({ id: crypto.randomUUID(), ...data });
  save(); render();
};
$('f-cancel').onclick = () => $('dlg').close();
$('f-del').onclick = () => {
  db[fmt(day)] = db[fmt(day)].filter(b => b.id !== editing.id);
  save(); render(); $('dlg').close();
};

const go = n => { day.setDate(day.getDate()+n); render(); };
$('prev').onclick = () => go(-1); $('next').onclick = () => go(1);
$('today').onclick = () => { day = new Date(); day.setHours(0,0,0,0); render(); scrollNow(); };

// 백업
$('menu').onclick = () => $('mdlg').showModal();
$('m-close').onclick = () => $('mdlg').close();
$('m-export').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'}));
  a.download = `planner-${fmt(new Date())}.json`; a.click();
};
$('m-import').onclick = () => $('file').click();
$('file').onchange = async e => {
  try {
    const data = JSON.parse(await e.target.files[0].text());
    if (typeof data !== 'object' || Array.isArray(data)) throw 0;
    if (!confirm('현재 데이터를 가져온 데이터로 덮어쓸까요?')) return;
    db = data; save(); render(); $('mdlg').close();
  } catch { alert('올바른 백업 파일이 아니에요'); }
  e.target.value = '';
};

function scrollNow() { scrollTo(0, Math.max(0, (Math.max(new Date().getHours(),START)-START-1)*H)); }
render(); scrollNow(); setInterval(render, 60000);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
